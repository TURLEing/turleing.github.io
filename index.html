<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>天泽龟的龟壳屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Unbounded:wght@400;600&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#cddfe6;
  --ink:#1c2340;
  --ink-soft:#56607e;
  --panel:rgba(255,255,255,.72);
  --panel-line:rgba(28,35,64,.08);
  --hover:rgba(28,35,64,.06);
  --glow:rgba(255,255,255,.75);
  --c-blog:#e8452c;
  --c-academic:#e0a12e;
  --c-github:#2fb5a8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#1b2a52; --ink:#f3f0e8; --ink-soft:#a9b2cf;
    --panel:rgba(12,20,44,.62); --panel-line:rgba(255,255,255,.1); --hover:rgba(255,255,255,.08); --glow:rgba(8,14,34,.6);
    --c-blog:#ff6a4d; --c-academic:#ffc24d; --c-github:#4fe0cf;
  }
}
:root[data-theme="dark"]{
  --sky:#1b2a52; --ink:#f3f0e8; --ink-soft:#a9b2cf;
  --panel:rgba(12,20,44,.62); --panel-line:rgba(255,255,255,.1); --hover:rgba(255,255,255,.08); --glow:rgba(8,14,34,.6);
  --c-blog:#ff6a4d; --c-academic:#ffc24d; --c-github:#4fe0cf;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--sky);color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.grabbing{cursor:grabbing}
#scene.pointing{cursor:pointer}

/* clock */
.clock{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 26px);
  left:calc(env(safe-area-inset-left,0px) + 28px);
  pointer-events:none;
  text-shadow:0 1px 16px var(--glow);
}
.clock time{display:block}
.clock .hm{
  font-family:"Unbounded","Noto Sans SC",sans-serif;font-weight:600;
  font-size:clamp(34px,4.4vw,52px);line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.clock .hm .colon{display:inline-block;margin:0 .04em;transform:translateY(-.06em)}
.clock .date{margin-top:10px;font-size:14px;color:var(--ink-soft);font-weight:500}
.clock .phase{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  font-size:13px;font-weight:500;padding:3px 10px 3px 8px;border-radius:999px;
  background:var(--panel);border:1px solid var(--panel-line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.clock .mode{
  pointer-events:auto;display:flex;gap:2px;margin-top:10px;padding:3px;width:max-content;
  border-radius:999px;background:var(--panel);border:1px solid var(--panel-line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.clock .mode button{
  font:inherit;font-size:13px;font-weight:500;color:var(--ink-soft);
  background:none;border:0;border-radius:999px;padding:5px 12px;cursor:pointer;
  transition:background-color .2s,color .2s;
}
.clock .mode button:hover{color:var(--ink)}
.clock .mode button[aria-checked="true"]{background:var(--ink);color:var(--sky)}
.clock .mode button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.clock .phase i{width:8px;height:8px;border-radius:50%;background:var(--c-academic);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-academic) 25%,transparent)}

/* title */
.title{
  position:fixed;
  top:calc(env(safe-area-inset-top,0px) + 24px);
  right:calc(env(safe-area-inset-right,0px) + 28px);
  display:flex;align-items:center;gap:14px;
  pointer-events:none;text-align:right;
}
.title img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 6px 20px rgba(20,30,60,.18)}
.title h1{
  margin:0;
  font-family:"ZCOOL QingKe HuangYou","Noto Sans SC",sans-serif;font-weight:400;
  font-size:clamp(30px,4.2vw,54px);line-height:1;letter-spacing:.02em;
  text-shadow:0 1px 18px var(--glow);
}
.title p{margin:8px 0 0;font-size:14px;color:var(--ink-soft);text-shadow:0 1px 12px var(--glow)}

/* dock */
.dock{
  position:fixed;
  left:calc(env(safe-area-inset-left,0px) + 24px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding:8px;
  background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:0 10px 40px rgba(20,30,60,.12);
}
.dock ul{list-style:none;margin:0;padding:0;display:flex;gap:4px}
.dock a{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px 10px 10px;border-radius:12px;
  color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;white-space:nowrap;
  transition:background-color .18s;
}
.dock a .ic{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:var(--c);color:#fff;transition:transform .2s;
}
.dock a .ic svg{width:18px;height:18px}
.dock a small{display:block;font-size:12px;font-weight:400;color:var(--ink-soft);margin-top:1px}
.dock a.lit{background:var(--hover)}
.dock a.lit .ic{transform:translateY(-2px) rotate(-6deg)}
.dock a:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.dock .hint{margin:6px 10px 2px;font-size:12px;color:var(--ink-soft)}

.tip{
  position:fixed;left:0;top:0;pointer-events:none;
  padding:6px 12px;border-radius:999px;
  background:var(--ink);color:var(--sky);font-size:13px;font-weight:500;white-space:nowrap;
  opacity:0;transform:translate(-50%,-150%);transition:opacity .15s;
}
.tip.show{opacity:1}
.bubble{
  position:fixed;left:0;top:0;pointer-events:none;z-index:5;
  padding:9px 15px;border-radius:14px;
  background:var(--ink);color:var(--sky);font-size:15px;font-weight:500;white-space:nowrap;
  box-shadow:0 8px 24px rgba(20,30,60,.2);
  opacity:0;transform:translate(-50%,calc(-100% - 12px)) scale(.6);transform-origin:50% 100%;
  transition:opacity .18s,transform .3s cubic-bezier(.3,1.6,.5,1);
}
.bubble::after{
  content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;margin-left:-6px;
  background:inherit;transform:rotate(45deg);border-radius:2px;
}
.bubble.show{opacity:1;transform:translate(-50%,calc(-100% - 12px)) scale(1)}
@media (prefers-reduced-motion: reduce){ .bubble{transition:opacity .18s} }
.toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 24px);
  transform:translate(-50%,-10px);max-width:min(88vw,440px);
  padding:10px 16px;border-radius:12px;
  background:var(--ink);color:var(--sky);font-size:14px;line-height:1.6;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .dock ul{flex-direction:column}
  .dock small{display:none}
}
@media (max-width:560px){
  .clock{top:calc(env(safe-area-inset-top,0px) + 16px);left:calc(env(safe-area-inset-left,0px) + 16px)}
  .clock .hm{font-size:30px}
  .clock .date{font-size:12px;margin-top:6px}
  .clock .phase{display:none}
  .clock .mode{margin-top:8px}
  .clock .mode button{padding:4px 9px;font-size:12px}
  .title{top:calc(env(safe-area-inset-top,0px) + 16px);right:calc(env(safe-area-inset-right,0px) + 16px);gap:10px}
  .title img{width:38px;height:38px;border-width:2px}
  .title h1{font-size:24px}
  .title p{display:none}
  .dock{left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
  .dock ul{flex-direction:row}
  .dock a{flex:1;flex-direction:column;gap:6px;padding:10px 4px;font-size:13px;text-align:center}
  .dock li{flex:1;display:flex}
  .dock .hint{text-align:center}
}
@media (prefers-reduced-motion: reduce){
  .dock a,.dock a .ic,.tip,.toast{transition:none}
}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div class="clock" aria-live="off">
  <time class="hm" id="hm">--<span class="colon">:</span>--</time>
  <time class="date" id="date"></time>
  <span class="phase" id="phase"><i></i><span id="phaseText">白天</span></span>
  <div class="mode" role="radiogroup" aria-label="昼夜切换">
    <button type="button" role="radio" data-mode="auto">跟随时间</button>
    <button type="button" role="radio" data-mode="day">白天</button>
    <button type="button" role="radio" data-mode="night">夜晚</button>
  </div>
</div>

<header class="title">
  <div>
    <h1>天泽龟的龟壳屋</h1>
    <p>欢迎进来坐坐，随便看看</p>
  </div>
  <img id="avatarImg" alt="天泽龟的头像">
</header>

<nav class="dock" aria-label="去处">
  <ul>
    <li><a id="link-blog" data-key="blog" href="/blog/" style="--c:var(--c-blog)">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V10a6 6 0 0 1 12 0v11"/><path d="M4 21h16"/><circle cx="14.5" cy="14.5" r=".6" fill="currentColor"/></svg></span>
      <span>博客<small>进门看文章</small></span></a></li>
    <li><a id="link-academic" data-key="academic" href="/cv/" style="--c:var(--c-academic)">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/></svg></span>
      <span>学术主页<small>推窗看论文</small></span></a></li>
    <li><a id="link-github" data-key="github" href="https://github.com/TURLEing" style="--c:var(--c-github)" target="_blank" rel="noopener noreferrer">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l4 4-4 4"/><path d="M12 16h7"/></svg></span>
      <span>GitHub<small>上船看代码</small></span></a></li>
  </ul>
  <p class="hint">拖动可以绕一圈，点门、窗或小船上的屏幕都能进去</p>
</nav>

<div class="tip" id="tip"></div>
<div class="bubble" id="bubble" role="status" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    // 旗子：平时轻飘，点击后猛烈飘一阵
    let burst = 0;
    if (flagBurst >= 0) { flagBurst += dt; burst = Math.max(0, 1 - flagBurst / 1.5); if (flagBurst > 1.5) flagBurst = -1; }
    flagPhase += dt * (3.5 + burst * 10);
    flag.rotation.y = .55 + Math.sin(flagPhase * .6) * .3 * burst;
    placeBubble();
    const fp = flagGeo.attributes.position;
    for (let i = 0; i < fp.count; i++) {
      const x = flagBase0[i * 3];
      const k = x / .52;
      fp.array[i * 3 + 2] = Math.sin(x * 8 - flagPhase) * (.04 * motion + .16 * burst) * k;
      fp.array[i * 3 + 1] = flagBase0[i * 3 + 1] + Math.sin(x * 11 - flagPhase * 1.3) * .035 * burst * k;
    }
    fp.needsUpdate = true;

    puffs.forEach((p, i) => {
      const life = ((t * .28 + i / puffs.length) % 1);
      p.position.set(chimTop.x + Math.sin(life * 4 + i) * .08 - life * .35, chimTop.y + life * 1.5, chimTop.z - life * .25);
      p.scale.setScalar(.6 + life * 1.8); p.rotation.set(life * 2, i, life);
      p.material.opacity = motion ? Math.sin(Math.PI * life) * .55 : 0;
    });
    rings.forEach((m, i) => {
      const life = ((t * .22 + i / rings.length) % 1);
      const s = 1.7 + life * 2.6; m.scale.set(s * 1.08, s, 1);
      m.material.opacity = motion ? (1 - life) * Math.min(1, life * 6) * .38 : 0;
    });
    if (motion) reedGroups.forEach(g => { g.rotation.x += (Math.sin(t * .8 + g.userData.phase) * .05 - g.rotation.x) * .02; });

    if (fireflies.visible) {
      ffBase.forEach(([x, y, z, ph2], i) => {
        ffPos[i * 3] = x + Math.sin(t * .5 + ph2) * .35 * motion;
        ffPos[i * 3 + 1] = y + Math.sin(t * .9 + ph2 * 2) * .22 * motion;
        ffPos[i * 3 + 2] = z + Math.cos(t * .4 + ph2) * .35 * motion;
      });
      ffGeo.attributes.position.needsUpdate = true;
      fireflies.material.opacity = clamp((nightCur - .45) / .55, 0, 1) * (.65 + Math.sin(t * 3) * .25 * motion);
    }
    stars.rotation.y = t * .004 * motion;

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
